<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0f5450">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="工数ログ">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<title>工数ログ 久保</title>
<style>
:root{
  --paper:#f2f3f0; --card:#fff; --ink:#15181a; --ink2:#4a4f4c; --mut:#767b75;
  --line:#dfe1dc; --rule:#c2c5be; --accent:#0f5450;
  --c1:#2f6fb0; --c2:#1f7a5a; --c3:#8a5cb8; --c4:#8a8880;
  --shadow:0 1px 2px rgba(0,0,0,.05);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --paper:#101211; --card:#1a1d1b; --ink:#eef0ec; --ink2:#b8bdb7; --mut:#8d938c;
  --line:#2a2e2b; --rule:#3b403c; --accent:#5cbdb4;
  --c1:#63a4dd; --c2:#4fb98d; --c3:#b394e0; --c4:#9a9a94;
  --shadow:none;
}}
:root[data-theme="dark"]{
  --paper:#101211; --card:#1a1d1b; --ink:#eef0ec; --ink2:#b8bdb7; --mut:#8d938c;
  --line:#2a2e2b; --rule:#3b403c; --accent:#5cbdb4;
  --c1:#63a4dd; --c2:#4fb98d; --c3:#b394e0; --c4:#9a9a94;
  --shadow:none;
}
*{box-sizing:border-box;}
/* 押下フィードバック: 押した瞬間に縮む＋薄くなる（ライト/ダーク両対応） */
button:active,.hbtn:active,label.btn:active{
  transform:scale(.96);opacity:.7;transition:none;}
body{background:var(--paper);margin:0;}
.app{font-family:system-ui,-apple-system,"Segoe UI","Hiragino Sans","Yu Gothic UI",sans-serif;
  color:var(--ink);max-width:560px;margin:0 auto;padding:16px 14px 96px;
  font-size:15px;line-height:1.6;font-variant-numeric:tabular-nums;}

.hd{display:flex;align-items:baseline;gap:10px;margin-bottom:12px;}
.hd h1{font-size:17px;font-weight:700;margin:0;}
.hd .dt{margin-left:auto;font-size:14px;color:var(--ink2);}

button{font:inherit;color:inherit;cursor:pointer;}
.panel{display:none;}
.panel.on{display:block;}

/* 固定タブバー */
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:10;
  background:var(--paper);border-top:1px solid var(--line);
  padding:8px 14px calc(8px + env(safe-area-inset-bottom,0px));}
.tabbar .tw{max-width:560px;margin:0 auto;display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px;
  background:var(--card);border:1px solid var(--line);border-radius:13px;padding:5px;}
.tabbar button{border:none;background:none;border-radius:9px;padding:10px 4px;
  font-size:14px;font-weight:700;color:var(--mut);-webkit-tap-highlight-color:transparent;}
.tabbar button.on{background:var(--accent);color:#fff;}

/* 計測 */
.now{background:var(--card);border:1px solid var(--line);border-radius:14px;
  padding:16px;box-shadow:var(--shadow);margin-bottom:12px;text-align:center;}
.now .lbl{font-size:14px;font-weight:700;color:var(--mut);}
.now .el{font-size:clamp(40px,13vw,60px);font-weight:800;letter-spacing:-.03em;line-height:1;margin:6px 0 2px;}
.now .since{font-size:13px;color:var(--mut);}
.now.on .lbl{color:var(--ink);}
.catrow{width:100%;background:var(--card);border:2px solid var(--line);border-radius:14px;
  padding:14px;display:flex;align-items:center;gap:10px;box-shadow:var(--shadow);
  margin-bottom:8px;text-align:left;-webkit-tap-highlight-color:transparent;
  transition:border-color .12s,background .12s;}
.catrow .dot{width:10px;height:10px;border-radius:50%;background:currentColor;flex:none;}
.catrow .nm{flex:1;font-size:15px;font-weight:700;color:var(--ink);line-height:1.3;}
.catrow .h{font-size:16px;font-weight:800;color:var(--ink);white-space:nowrap;}
.catrow .go{font-size:13px;font-weight:700;color:var(--mut);white-space:nowrap;}
.catrow.on{border-color:currentColor;background:color-mix(in srgb,currentColor 10%,var(--card));}
.catrow.on .go{color:var(--ink);}
.c1{color:var(--c1);} .c2{color:var(--c2);} .c3{color:var(--c3);} .c4{color:var(--c4);}
.bar{display:flex;gap:8px;margin-top:4px;}
.bar button{flex:1;background:var(--card);border:1px solid var(--rule);border-radius:11px;
  padding:11px 8px;font-size:14px;font-weight:600;}
.bar button.stop{border-color:var(--accent);color:var(--accent);}

h2{font-size:14px;font-weight:700;color:var(--mut);margin:24px 0 8px;letter-spacing:.04em;
  display:flex;align-items:baseline;}
h2 .sub{margin-left:auto;font-weight:600;}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;
  padding:4px 14px;box-shadow:var(--shadow);}
.row{display:flex;align-items:center;gap:10px;padding:11px 0;border-bottom:1px solid var(--line);}
.row:last-child{border-bottom:none;}
.row .t{font-size:14px;color:var(--ink2);white-space:nowrap;}
.row .n{flex:1;font-weight:600;}
.row .d{font-weight:700;white-space:nowrap;}
.row .x{background:none;border:none;color:var(--mut);font-size:19px;line-height:1;padding:2px 4px;}
.empty{padding:14px 0;color:var(--mut);font-size:14px;}

.add{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px;}
.add select,.add input{font:inherit;font-size:14px;padding:9px 10px;border:1px solid var(--rule);
  border-radius:10px;background:var(--card);color:var(--ink);}
.add select{flex:1 1 100%;}
.add input[type="number"]{width:78px;}
.add input[type="time"]{width:106px;}
.add button{padding:9px 12px;border:1px solid var(--rule);border-radius:10px;
  background:var(--card);font-weight:600;font-size:14px;flex:1;}
.add .lb{font-size:14px;color:var(--ink2);align-self:center;}

/* 件数 */
.inbox{background:var(--card);border:1px solid var(--line);border-radius:14px;
  padding:14px;box-shadow:var(--shadow);}
.inbox .memo{width:100%;font:inherit;font-size:14px;padding:10px 11px;margin-bottom:10px;
  border:1px solid var(--rule);border-radius:10px;background:var(--card);color:var(--ink);}
.plusrow{display:flex;gap:12px;align-items:center;}
.plus{flex:1;padding:20px 10px;border:none;border-radius:12px;
  background:var(--accent);color:#fff;font-size:20px;font-weight:800;
  -webkit-tap-highlight-color:transparent;}
.pstat{text-align:right;font-size:14px;color:var(--ink2);line-height:1.5;white-space:nowrap;}
.pstat b{font-size:22px;color:var(--ink);}
.glabel{font-size:13px;font-weight:700;color:var(--mut);letter-spacing:.05em;
  margin:12px 0 2px;padding-top:10px;border-top:1px solid var(--line);}
.glabel:first-of-type{margin-top:0;padding-top:0;border-top:none;}
.funrow{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-top:10px;}
.funrow button{background:var(--card);border:1px solid var(--rule);border-radius:11px;
  padding:10px 5px;font-size:14px;font-weight:700;line-height:1.45;
  -webkit-tap-highlight-color:transparent;}
.funrow button small{display:block;font-size:13px;font-weight:600;color:var(--mut);}
.last{display:flex;align-items:center;gap:8px;margin-top:10px;font-size:14px;color:var(--ink2);}
.last b{color:var(--ink);}
.last button{margin-left:auto;background:none;border:1px solid var(--rule);border-radius:9px;
  padding:6px 10px;font-size:13px;font-weight:600;color:var(--ink2);white-space:nowrap;}
.evrow input{flex:1;min-width:0;font:inherit;font-size:14px;padding:6px 9px;
  border:1px solid var(--rule);border-radius:8px;background:var(--card);color:var(--ink);}

/* 分析 */
.prog .nm2{width:104px;font-weight:700;font-size:14px;flex:none;}
.pbar{position:relative;flex:1;height:10px;border-radius:6px;background:var(--line);}
.pbar i{position:absolute;left:0;top:0;bottom:0;border-radius:6px;background:var(--accent);}
.pbar u{position:absolute;top:-3px;bottom:-3px;width:2px;background:var(--mut);}
.pval{font-weight:700;white-space:nowrap;font-size:14px;}
.tlwrap{padding:14px;}
.tl{display:flex;height:24px;border-radius:6px;overflow:hidden;border:1px solid var(--line);}
.tl i{display:block;height:100%;}
.tlx{display:flex;justify-content:space-between;font-size:13px;color:var(--mut);margin-top:3px;}
.wk .row .n{font-weight:700;}
.wk .meter{flex:1;height:8px;border-radius:5px;background:var(--line);overflow:hidden;max-width:130px;}
.wk .meter i{display:block;height:100%;border-radius:5px;background:currentColor;}
.hline{flex-basis:100%;font-size:14px;color:var(--ink2);line-height:1.5;}
/* 週の合計行: 上下の太線で囲んだ帯＋左に四角マーク。一目で「合計」と分かるように */
.wkhdr{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;
  border-top:3px solid var(--ink);border-bottom:3px solid var(--ink);
  margin:12px -14px 0;padding:9px 14px;
  background:color-mix(in srgb,var(--accent) 10%,var(--card));}
.wkhdr .wn{font-size:15px;font-weight:800;display:flex;align-items:center;gap:9px;}
.wkhdr .wn::before{content:"";width:12px;height:12px;border-radius:2px;background:var(--accent);flex:none;}
.wkhdr .ws{margin-left:auto;font-size:15px;font-weight:800;white-space:nowrap;}
#hist .wkhdr:first-child{margin-top:0;}
.hbtn{background:none;border:1px solid var(--rule);border-radius:9px;
  padding:5px 10px;font-size:13px;font-weight:600;color:var(--ink2);white-space:nowrap;}
.hdet{flex-basis:100%;border-top:1px solid var(--line);margin-top:8px;}
/* 日ごとのメモ: 見出しに見えないよう控えめに（背景なし・細い罫線・薄めの文字） */
.hnote{flex-basis:100%;font-size:14px;line-height:1.5;color:var(--ink2);
  border-left:2px solid var(--rule);padding:2px 0 2px 10px;margin-top:2px;white-space:pre-wrap;}
.hnote::before{content:"メモ: ";color:var(--mut);font-weight:600;}
.dnote{padding:10px 0 4px;}
.dnote textarea{width:100%;min-height:64px;font:inherit;font-size:14px;
  padding:9px 10px;border:1px solid var(--rule);border-radius:10px;
  background:var(--card);color:var(--ink);resize:vertical;}
.dnote .lb2{font-size:13px;font-weight:700;color:var(--mut);
  letter-spacing:.04em;margin-bottom:5px;}
.drow{display:flex;align-items:center;gap:9px;padding:8px 0;font-size:14px;
  border-bottom:1px solid var(--line);}
.drow:last-child{border-bottom:none;}
.drow .n{flex:1;font-weight:600;}
.drow .t{color:var(--ink2);white-space:nowrap;}
.drow .d{font-weight:700;white-space:nowrap;}

details{margin-top:16px;}
summary{font-size:14px;font-weight:700;color:var(--mut);cursor:pointer;
  padding:4px 0;letter-spacing:.04em;list-style-position:inside;}
details .card{margin-top:8px;}
.setgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:12px 0 4px;}
.setgrid label{font-size:14px;font-weight:600;display:flex;flex-direction:column;gap:4px;color:var(--ink2);}
.setgrid input{font:inherit;padding:9px 10px;border:1px solid var(--rule);border-radius:10px;
  background:var(--card);color:var(--ink);width:100%;}
.btn{padding:10px 14px;border:1px solid var(--rule);border-radius:10px;
  background:var(--card);font-weight:700;font-size:14px;margin:10px 0;}
.sync textarea{width:100%;min-height:72px;font:inherit;font-size:13px;padding:9px 10px;
  border:1px solid var(--rule);border-radius:10px;background:var(--card);color:var(--ink);
  margin-top:10px;}
.copy{width:100%;margin-top:22px;padding:15px;border:none;border-radius:13px;
  background:var(--accent);color:#fff;font-size:16px;font-weight:700;}
.copy.done{background:var(--c2);}
.note{font-size:13px;color:var(--mut);margin-top:10px;}
</style>

<div class="app">
  <div class="hd"><h1>工数ログ</h1><span class="dt" id="today"></span></div>

  <!-- ⏱ 計測 -->
  <div class="panel on" id="tab-time">
    <div class="now" id="now">
      <div class="lbl" id="nowLbl">計測していません</div>
      <div class="el" id="elapsed">0:00</div>
      <div class="since" id="since">下のボタンを押すと開始</div>
    </div>
    <div id="cats"></div>
    <div class="bar">
      <button class="stop" id="stopBtn">停止</button>
      <button id="undoBtn">直前を取消</button>
    </div>

    <h2>今日の計測記録</h2>
    <div class="card" id="sessions"></div>

    <h2>後から入力（押し忘れ・切り忘れ用）</h2>
    <div class="card" style="padding:12px 14px">
      <div class="add" style="margin-top:0">
        <select id="mCat"></select>
        <input id="mMin" type="number" inputmode="numeric" placeholder="分" min="5" step="5">
        <button id="mAdd">今から遡って追加</button>
      </div>
      <div class="add">
        <span class="lb">日付</span><input id="mDate" type="date">
        <span class="lb">開始</span><input id="mFrom" type="time">
        <span class="lb">終了</span><input id="mTo" type="time">
        <button id="tAdd">時刻で追加</button>
      </div>
    </div>
  </div>

  <!-- ＋ 件数 -->
  <div class="panel" id="tab-count">
    <div class="inbox">
      <input class="memo" id="memo" placeholder="案件名・メモ（任意）→ 次に押す +1 に付きます">
      <div class="glabel">SES</div>
      <div class="plusrow">
        <button class="plus" id="propBtn">提案 +1</button>
        <div class="pstat">今日 <b id="propToday">0</b>件<br>今月 <span id="propMonth">0</span>件</div>
      </div>
      <div class="funrow" id="funRow"></div>
      <div class="glabel">エンド開拓</div>
      <div class="funrow" id="funRow2"></div>
      <div class="last" id="lastEv" hidden></div>
    </div>

    <h2>今日の件数</h2>
    <div class="card" id="evList"></div>

    <h2>後から入力（過去日の件数）</h2>
    <div class="card" style="padding:12px 14px">
      <div class="add" style="margin-top:0">
        <select id="eKind"></select>
        <input id="eDate" type="date">
        <input id="eNum" type="number" inputmode="numeric" placeholder="件" min="1" step="1">
        <button id="eAdd">追加</button>
      </div>
    </div>
  </div>

  <!-- 📊 分析 -->
  <div class="panel" id="tab-ana">
    <h2 style="margin-top:0" id="moTitle">今月の進捗<span class="sub" id="moDays"></span></h2>
    <div class="card prog" id="month"></div>

    <h2>今日のタイムライン</h2>
    <div class="card tlwrap" id="tlCard"></div>

    <h2 id="wkTitle">今週（土〜金）</h2>
    <div class="card wk" id="week"></div>

    <h2>履歴（過去30日）</h2>
    <div class="card" id="hist"></div>
    <button class="btn" id="histCopy">履歴をコピー（30日・表形式）</button>

    <button class="copy" id="copyBtn">この内容をコピー</button>

    <details>
      <summary>今月の目標</summary>
      <div class="card">
        <div class="setgrid" id="setGrid"></div>
        <button class="btn" id="setSave">目標を保存</button>
      </div>
    </details>

    <details class="sync">
      <summary>データ同期（PC⇄スマホ）</summary>
      <div class="card">
        <div style="padding-top:12px">
          <button class="btn" id="expBtn" style="margin:0">この端末のデータを書き出す（コピー）</button>
          <button class="btn" id="bkBtn" hidden>バックアップをファイルに保存</button>
          <label class="btn" for="impFile" style="display:inline-block">ファイルから復元</label>
          <input id="impFile" type="file" accept=".json,application/json" hidden>
          <textarea id="impText" placeholder="もう一方の端末で書き出したデータをここに貼る"></textarea>
          <button class="btn" id="impBtn">取り込む（統合・上書きしない）</button>
          <div class="note" style="margin-top:0">計測を停止してから書き出してください。取り込み・復元は追加のみで、既存データは消えません。</div>
        </div>
      </div>
    </details>

    <div class="note">データはこの端末のブラウザに保存されます。コピーしてClaudeに貼ると日報データに入ります。</div>
  </div>
</div>

<nav class="tabbar"><div class="tw">
  <button class="on" data-p="tab-time">⏱ 計測</button>
  <button data-p="tab-count">＋ 件数</button>
  <button data-p="tab-ana">📊 分析</button>
</div></nav>

<script>
// id は過去データとの互換のため施策IDのまま。ラベルだけ変更（2026-08-14）
const CATS=[
 {id:"S2607-02",nm:"提案",cls:"c1"},
 {id:"S2607-03",nm:"面談以降",cls:"c3"},
 {id:"S2607-01",nm:"エンド開拓",cls:"c2"},
 {id:"none",nm:"施策外",cls:"c4"}
];
const EVS=[
 {id:"prop",nm:"提案"},
 {id:"meet",nm:"面談依頼"},
 {id:"offer",nm:"オファー"},
 {id:"deal",nm:"決定"},
 {id:"esales",nm:"営業"},
 {id:"eappo",nm:"アポ"},
 {id:"ecase",nm:"案件化"}
];
const SES_EVS=["meet","offer","deal"];
const END_EVS=["esales","eappo","ecase"];
// 目標のキー: prop=提案件数, hours=提案投下時間(S2607-02の月間h), meet, offer, deal
const KEY="kubo-timelog-v2";
const OLDKEY="kubo-timelog-v1";
const WD=["日","月","火","水","木","金","土"];
// 1日の区切りは朝5時。深夜0〜5時の記録・日報は「前日」として扱う
// （日付を跨いでから日報を書く運用のため。変えたい場合はこの数字だけ直す）
const DAY_START=5;
// 表示・集計用の「いまの作業日」（実時刻から5時間引いた日付）
function workNow(){return new Date(Date.now()-DAY_START*36e5);}
let db={sessions:[],events:[],running:null,goals:{}};

function load(){
  try{const r=localStorage.getItem(KEY);if(r)db=JSON.parse(r);}catch(e){}
  if(!db||typeof db!=="object")db={};
  if(!Array.isArray(db.sessions))db.sessions=[];
  if(!Array.isArray(db.events))db.events=[];
  if(!db.goals)db.goals={};
  if(!db.notes)db.notes={};
  if(db.running===undefined)db.running=null;
  if(!db.migrated){
    try{const r=localStorage.getItem(OLDKEY);
      if(r){const od=JSON.parse(r);
        if(Array.isArray(od.sessions)){
          const seen=new Set(db.sessions.map(s=>s.start+"|"+s.cat));
          od.sessions.forEach(s=>{if(s&&!seen.has(s.start+"|"+s.cat))db.sessions.push(s);});
        }
        if(od.running&&!db.running)db.running=od.running;
      }}catch(e){}
    db.migrated=true;
    db.sessions.sort((a,b)=>a.start-b.start);
    save();
  }
}
function save(){try{localStorage.setItem(KEY,JSON.stringify(db));}catch(e){}}

const pad=n=>String(n).padStart(2,"0");
const esc=s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const hm=ts=>{const d=new Date(ts);return pad(d.getHours())+":"+pad(d.getMinutes());};
function dur(ms){const m=Math.round(ms/60000);return Math.floor(m/60)+":"+pad(m%60);}
function hrs(ms){return (ms/3600000).toFixed(1);}
// 週は土曜はじまり・金曜おわり（毎週土曜の定例に合わせる）
function weekStart(d){const x=new Date(d.getFullYear(),d.getMonth(),d.getDate());
  const back=(x.getDay()+1)%7;x.setDate(x.getDate()-back);return x;}
function todayRange(){const d=workNow();
  const a=new Date(d.getFullYear(),d.getMonth(),d.getDate()).getTime()+DAY_START*36e5;
  return [a,a+864e5];}
function weekRange(){const a=weekStart(workNow()).getTime()+DAY_START*36e5;
  return [a,a+7*864e5];}
function monthRange(){const d=workNow();
  return [new Date(d.getFullYear(),d.getMonth(),1).getTime()+DAY_START*36e5,
          new Date(d.getFullYear(),d.getMonth()+1,1).getTime()+DAY_START*36e5];}
function monthKey(){const d=workNow();return d.getFullYear()+"-"+pad(d.getMonth()+1);}
function dayKey(ts){const d=new Date(ts-DAY_START*36e5);
  return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());}
function noteOf(ts){const n=db.notes[dayKey(ts)];return n&&n.t?n.t:"";}

function totals(from,to){
  const t={};CATS.forEach(c=>t[c.id]=0);
  db.sessions.forEach(s=>{if(s.start>=from&&s.start<to&&t[s.cat]!==undefined)t[s.cat]+=s.ms;});
  if(db.running&&db.running.start>=from&&db.running.start<to)
    t[db.running.cat]+=Date.now()-db.running.start;
  return t;
}
function evsIn(from,to,type){
  return db.events.filter(e=>e.ts>=from&&e.ts<to&&(!type||e.t===type));
}
function evCounts(from,to){
  const c={};EVS.forEach(e=>c[e.id]=0);
  db.events.forEach(e=>{if(e.ts>=from&&e.ts<to&&c[e.t]!==undefined)c[e.t]++;});
  return c;
}

function start(cat){
  if(db.running){if(db.running.cat===cat){stop();return;}stop();}
  db.running={cat:cat,start:Date.now()};save();render();
}
function stop(){
  if(!db.running)return;
  const ms=Date.now()-db.running.start;
  if(ms>=30000)db.sessions.push({cat:db.running.cat,start:db.running.start,end:Date.now(),ms:ms});
  db.running=null;save();render();
}
function undo(){
  if(db.running){
    const c=CATS.find(x=>x.id===db.running.cat);
    if(!confirm("計測中の「"+(c?c.nm:"")+"」を記録せず破棄しますか？"))return;
    db.running=null;save();render();return;
  }
  const [a,b]=todayRange();
  for(let i=db.sessions.length-1;i>=0;i--){
    const s=db.sessions[i];
    if(s.start>=a&&s.start<b){
      const c=CATS.find(x=>x.id===s.cat);
      if(!confirm("直前の記録 "+hm(s.start)+"–"+hm(s.end)+" "+(c?c.nm:s.cat)+" を削除しますか？"))return;
      db.sessions.splice(i,1);break;
    }
  }
  save();render();
}
function addEvent(type){
  const inp=document.getElementById("memo");
  const nm=inp.value.trim();
  const e={t:type,ts:Date.now()};
  if(nm)e.nm=nm;
  db.events.push(e);
  inp.value="";
  save();render();
}
function undoEvent(idx){
  const e=db.events[idx];if(!e)return;
  const ev=EVS.find(x=>x.id===e.t);
  if(!confirm(hm(e.ts)+" の「"+(ev?ev.nm:e.t)+" +1"+(e.nm?"（"+e.nm+"）":"")+"」を取り消しますか？"))return;
  db.events.splice(idx,1);save();render();
}

      <span class="d">${dur(s.ms)}</span>

  }).join(""):`<div class="empty">まだありません</div>`;
  sBox.querySelectorAll(".x").forEach(b=>b.onclick=()=>{
    const s=db.sessions[+b.dataset.i];if(!s)return;

    db.sessions.splice(+b.dataset.i,1);save();render();});

  // 件数タブ

// 分析タブ: 過去7日の履歴（今日を含む・記録のある日だけ）
function renderHistory(){
  const box=document.getElementById("hist");
  const base=todayRange()[0];   // 朝5時区切りの「今日」の開始
  let h="", lastWk=null;
  for(let i=0;i<31;i++){
    const a=base-i*864e5, b=a+864e5;
    const t=totals(a,b), c=evCounts(a,b);
    const sum=Object.values(t).reduce((x,y)=>x+y,0);
    const note=noteOf(a);
    // 記録が無くてもメモがあれば残す（メモが隠れて読めなくなるのを防ぐ）
    if(sum<=0&&!EVS.some(e=>c[e.id]>0)&&!note&&i>0)continue;
    const d=new Date(a);
    // 週（土〜金）が変わったら区切り行を入れる。週の合計も添える
    const wsD=weekStart(new Date(a-DAY_START*36e5));
    const wa=wsD.getTime()+DAY_START*36e5, wb=wa+7*864e5;
    if(wa!==lastWk){
      lastWk=wa;
      const wt=totals(wa,wb), wc=evCounts(wa,wb);
      const wsum=Object.values(wt).reduce((x,y)=>x+y,0);
      const we=new Date(wa+6*864e5);
      h+=`<div class="wkhdr">
        <span class="wn">${wsD.getMonth()+1}/${wsD.getDate()}（土）〜${we.getMonth()+1}/${we.getDate()}（金）</span>
        <span class="ws">週計 ${hrs(wsum)}h ・ 提案 ${wc.prop}</span>
      </div>`;
    }
    const hours=CATS.filter(cat=>t[cat.id]>0)
      .map(cat=>`${cat.nm} ${hrs(t[cat.id])}h`).join(" ・ ");
    const cnts=EVS.filter(e=>c[e.id]>0)
      .map(e=>`${e.nm} ${c[e.id]}`).join(" ・ ");
    h+=`<div class="row" style="flex-wrap:wrap">
      <span class="n">${d.getMonth()+1}/${d.getDate()}（${WD[d.getDay()]}）${i===0?"・今日":""}</span>
      <span class="d">${hrs(sum)}h</span>
      <button class="hbtn" data-a="${a}">${openDay===a?"閉じる":"修正"}</button>
      ${hours?`<span class="hline">${hours}</span>`:""}
      ${cnts?`<span class="hline">件数: ${cnts}</span>`:""}
      ${note?`<div class="hnote">${esc(note)}</div>`:""}
      <div class="hdet" id="hdet-${a}"${openDay===a?"":" hidden"}></div>
    </div>`;
  }
  box.innerHTML=h||`<div class="empty">まだありません</div>`;
  box.querySelectorAll(".hbtn").forEach(b=>b.onclick=()=>{
    const a=+b.dataset.a;
    openDay=(openDay===a)?null:a;
    renderHistory();
  });
  if(openDay!==null)renderDayDetail(openDay);
}

// 履歴の1日を開いたときの明細（個別に削除できる）
let openDay=null;
function renderDayDetail(a){
  const el=document.getElementById("hdet-"+a);
  if(!el)return;
  const b=a+864e5;
  const ss=db.sessions.filter(x=>x.start>=a&&x.start<b).sort((x,y)=>x.start-y.start);
  const es=db.events.filter(x=>x.ts>=a&&x.ts<b).sort((x,y)=>x.ts-y.ts);
  let h="";
  ss.forEach(x=>{
    const c=CATS.find(y=>y.id===x.cat)||{nm:x.cat};
    h+=`<div class="drow"><span class="t">${hm(x.start)}–${hm(x.end)}</span>
      <span class="n">${c.nm}</span><span class="d">${dur(x.ms)}</span>
      <button class="x" data-si="${db.sessions.indexOf(x)}">×</button></div>`;
  });
  es.forEach(x=>{
    const ev=EVS.find(y=>y.id===x.t)||{nm:x.t};
    h+=`<div class="drow"><span class="t">${hm(x.ts)}</span>
      <span class="n">${ev.nm}${x.nm?`「${esc(x.nm)}」`:""}</span>
      <button class="x" data-ei="${db.events.indexOf(x)}">×</button></div>`;
  });
  el.innerHTML=(h||`<div class="empty" style="padding:8px 0">記録なし</div>`)+
    `<div class="dnote"><div class="lb2">この日のメモ</div>
      <textarea id="dnote-${a}" placeholder="例: 提案は実際5件。時間は+1.5h。あとで直す">${esc(noteOf(a))}</textarea></div>`;
  const na=document.getElementById("dnote-"+a);
  na.onchange=()=>{
    const v=na.value.trim(), k=dayKey(a);
    if(v)db.notes[k]={t:v,u:Date.now()};else delete db.notes[k];
    save();renderHistory();
  };
  el.querySelectorAll("[data-si]").forEach(btn=>btn.onclick=()=>{
    const x=db.sessions[+btn.dataset.si];if(!x)return;
    const c=CATS.find(y=>y.id===x.cat);
    if(!confirm(hm(x.start)+"–"+hm(x.end)+" "+(c?c.nm:x.cat)+" を削除しますか？"))return;
    db.sessions.splice(+btn.dataset.si,1);save();render();});
  el.querySelectorAll("[data-ei]").forEach(btn=>btn.onclick=()=>undoEvent(+btn.dataset.ei));
}

function renderTimeline(ta,tb){
  const box=document.getElementById("tlCard");
  const list=db.sessions.filter(s=>s.start>=ta&&s.start<tb)
    .map(s=>({cat:s.cat,start:s.start,end:s.end})).sort((a,b)=>a.start-b.start);
  if(db.running&&db.running.start>=ta&&db.running.start<tb)
    list.push({cat:db.running.cat,start:db.running.start,end:Date.now()});
  if(!list.length){box.innerHTML=`<div class="empty" style="padding:0">まだありません</div>`;return;}
  const H=3600000;
  const a=ta+Math.floor((Math.min(...list.map(s=>s.start))-ta)/H)*H;
  let b=ta+Math.ceil((Math.max(...list.map(s=>s.end))-ta)/H)*H;
  if(b<=a)b=a+H;
  const segs=[];let cur=a;
  list.forEach(s=>{
    const st=Math.max(s.start,cur), en=Math.max(st,Math.min(s.end,b));
    if(st>cur)segs.push({w:st-cur,cls:null});
    if(en>st){const c=CATS.find(x=>x.id===s.cat);
      segs.push({w:en-st,cls:c?c.cls:"c4"});cur=en;}
  });
  if(cur<b)segs.push({w:b-cur,cls:null});
  box.innerHTML=
    `<div class="tl">`+segs.map(s=>
      `<i style="flex:${Math.max(1,Math.round(s.w/60000))};background:${s.cls?`var(--${s.cls.replace("c","c")})`:"var(--line)"}"></i>`
    ).join("")+`</div>
    <div class="tlx"><span>${hm(a)}</span><span>${hm((a+b)/2)}</span><span>${hm(b)}</span></div>`;
}

      .map(c=>`${c.nm} ${hrs(wt[c.id])}h`).join(" / ")+`）\n`;
  t+=`今週件数 SES: 提案 ${wc.prop} ・ 面談依頼 ${wc.meet} ・ オファー ${wc.offer} ・ 決定 ${wc.deal}\n`;
  t+=`今週件数 エンド開拓: 営業 ${wc.esales} ・ アポ ${wc.eappo} ・ 案件化 ${wc.ecase}`;
  return t;
}

// 過去31日分を日ごとの表（タブ区切り）にする。記録の無い日も0で出す＝突合用
function historyText(){
  const base=todayRange()[0];
  const lines=[["日付","曜日","合計h",...CATS.map(c=>c.nm+"h"),...EVS.map(e=>e.nm),"メモ"].join("\t")];
  for(let i=30;i>=0;i--){
    const a=base-i*864e5, b=a+864e5;
    const t=totals(a,b), c=evCounts(a,b), d=new Date(a);
    const sum=Object.values(t).reduce((x,y)=>x+y,0);
    lines.push([
      `${d.getFullYear()}/${d.getMonth()+1}/${d.getDate()}`, WD[d.getDay()], hrs(sum),
      ...CATS.map(x=>hrs(t[x.id])), ...EVS.map(e=>c[e.id]),
      noteOf(a).replace(/[\t\n]+/g," ")
    ].join("\t"));
  }
  return lines.join("\n");
}

async function toClipboard(txt){
  try{await navigator.clipboard.writeText(txt);}
  catch(e){const ta=document.createElement("textarea");ta.value=txt;document.body.appendChild(ta);
    ta.select();try{document.execCommand("copy");}catch(_){}ta.remove();}
}

document.getElementById("tAdd").onclick=()=>{
  const f=document.getElementById("mFrom").value, to=document.getElementById("mTo").value;
  if(!f||!to){alert("開始と終了の時刻を両方入れてください。");return;}
  const dv=document.getElementById("mDate").value;
  let ta;
  if(dv){const [Y,M,D]=dv.split("-").map(Number);ta=new Date(Y,M-1,D).getTime();}
  else ta=todayRange()[0];
  // 0:00〜4:59 は「選んだ日の深夜」= 暦の上では翌日として扱う
  const p=v=>{const [h,m]=v.split(":").map(Number);
    return ta+((h<DAY_START?h+24:h)*60+m)*60000;};
  const s=p(f), e=p(to);
  if(e<=s){alert("終了は開始より後の時刻にしてください。");return;}
  const cat=document.getElementById("mCat").value;
  db.sessions.push({cat:cat,start:s,end:e,ms:e-s});
  db.sessions.sort((a,b)=>a.start-b.start);
  document.getElementById("mFrom").value="";document.getElementById("mTo").value="";
  save();render();
};
document.getElementById("eAdd").onclick=()=>{
  const dv=document.getElementById("eDate").value;
  const n=parseInt(document.getElementById("eNum").value,10);
  const kind=document.getElementById("eKind").value;
  if(!dv){alert("日付を入れてください。");return;}
  if(!n||n<1){alert("件数を入れてください。");return;}
  const [Y,M,D]=dv.split("-").map(Number);
  const base=new Date(Y,M-1,D,12,0,0).getTime();
  // 同じ日に複数入れても重複扱いにならないよう1分ずつずらす
  const used=new Set(db.events.filter(e=>e.t===kind).map(e=>e.ts));
  let t=base, added=0;
  for(let i=0;i<n;i++){
    while(used.has(t))t+=60000;
    db.events.push({t:kind,ts:t});used.add(t);t+=60000;added++;
  }
  db.events.sort((a,b)=>a.ts-b.ts);
  document.getElementById("eNum").value="";
  save();render();
  const ev=EVS.find(x=>x.id===kind);
  alert(`${M}/${D} に「${ev?ev.nm:kind}」を ${added}件 追加しました。`);
};

function mergeIncoming(inc){
  if(!inc||typeof inc!=="object")return null;
  const sk=new Set(db.sessions.map(s=>s.start+"|"+s.cat));
  let ns=0;
  (Array.isArray(inc.sessions)?inc.sessions:[]).forEach(s=>{
    if(s&&typeof s.start==="number"&&typeof s.ms==="number"&&!sk.has(s.start+"|"+s.cat)){
      db.sessions.push({cat:s.cat,start:s.start,end:s.end,ms:s.ms});
      sk.add(s.start+"|"+s.cat);ns++;}});
  const ek=new Map(db.events.map(e=>[e.ts+"|"+e.t,e]));
  let ne=0;
  (Array.isArray(inc.events)?inc.events:[]).forEach(e=>{
    if(e&&typeof e.ts==="number"&&typeof e.t==="string"){
      const k=e.ts+"|"+e.t, ex=ek.get(k);
      if(!ex){const o={t:e.t,ts:e.ts};if(e.nm)o.nm=String(e.nm);
        db.events.push(o);ek.set(k,o);ne++;}
      else if(e.nm&&!ex.nm)ex.nm=String(e.nm);}});
  Object.entries(inc.goals&&typeof inc.goals==="object"?inc.goals:{}).forEach(([m,g])=>{
    if(!g||typeof g!=="object")return;
    const cur=db.goals[m];
    if(!cur||(g.u||0)>(cur.u||0))db.goals[m]=g;});
  Object.entries(inc.notes&&typeof inc.notes==="object"?inc.notes:{}).forEach(([k,n])=>{
    if(!n||typeof n!=="object"||!n.t)return;
    const cur=db.notes[k];
    if(!cur||(n.u||0)>(cur.u||0))db.notes[k]={t:String(n.t),u:n.u||0};});
  db.sessions.sort((a,b)=>a.start-b.start);
  db.events.sort((a,b)=>a.ts-b.ts);
  save();setBuiltFor="";render();
  return {ns:ns,ne:ne};
}
document.getElementById("impBtn").onclick=()=>{
  const txt=document.getElementById("impText").value.trim();
  if(!txt)return;
  let inc;try{inc=JSON.parse(txt);}catch(e){alert("データを読み取れませんでした。書き出したものをそのまま貼ってください。");return;}
  const r=mergeIncoming(inc);
  if(!r){alert("データを読み取れませんでした。");return;}
  document.getElementById("impText").value="";
  alert(`取り込みました: 計測 +${r.ns} 件 / 件数イベント +${r.ne} 件`);
};
document.getElementById("impFile").onchange=ev=>{
  const f=ev.target.files&&ev.target.files[0];
  ev.target.value="";
  if(!f)return;
  const rd=new FileReader();
  rd.onload=()=>{
    let inc;try{inc=JSON.parse(String(rd.result));}
    catch(e){alert("このファイルを読み取れませんでした。工数ログのバックアップファイルを選んでください。");return;}
    const r=mergeIncoming(inc);
    if(!r){alert("このファイルを読み取れませんでした。");return;}
    alert(`復元しました: 計測 +${r.ns} 件 / 件数イベント +${r.ne} 件`);
  };
  rd.onerror=()=>alert("ファイルを開けませんでした。");
  rd.readAsText(f);
};

// バックアップをファイルに保存（Artifact内は downloads 機能、通常ブラウザは標準ダウンロード）
(async()=>{
  const btn=document.getElementById("bkBtn");
  const bkName=()=>{const d=new Date();
    return `timelog-backup-${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}.json`;};
  const bkBody=()=>JSON.stringify({v:2,exported:Date.now(),
    sessions:db.sessions,events:db.events,goals:db.goals,notes:db.notes});
  const dl=window.claude&&window.claude.use?await window.claude.use("downloads"):null;
  if(!dl){
    if(!("download" in document.createElement("a")))return;
    btn.hidden=false;
    btn.onclick=()=>{
      const u=URL.createObjectURL(new Blob([bkBody()],{type:"application/json"}));
      const a=document.createElement("a");a.href=u;a.download=bkName();
      document.body.appendChild(a);a.click();a.remove();
      setTimeout(()=>URL.revokeObjectURL(u),4000);
      btn.textContent="保存しました";
      setTimeout(()=>{btn.textContent="バックアップをファイルに保存";},1600);
    };
    return;
  }
  btn.hidden=false;
  btn.onclick=async()=>{
    btn.disabled=true;
    try{
      await dl.save({filename:bkName(),data:bkBody()});
      btn.textContent="保存しました";
      setTimeout(()=>{btn.textContent="バックアップをファイルに保存";},1600);
    }catch(e){
      const c=e&&e.code;
      if(c==="declined"){}
      else if(c==="rate_limited")alert("少し時間をおいてからもう一度押してください。");
      else if(c==="too_large")alert("データが大きすぎて保存できません。書き出し（コピー）を使ってください。");
      else{btn.hidden=true;alert("この画面ではファイル保存が使えません。書き出し（コピー）を使ってください。");}
    }finally{btn.disabled=false;}
  };
})();
